package:
  name: strela_cva6
  authors:
    - "Juan Granja <juan.granja@upm.es>"

dependencies:
  strela:                     { git: "https://github.com/m-d-upm/strela.git",                       rev: myrtus }
  common_cells:               { git: "https://github.com/pulp-platform/common_cells.git",           version: 1.30.0 }
  axi:                        { git: "https://github.com/pulp-platform/axi.git",                    version: 0.39.2 }
  register_interface:         { git: "https://github.com/pulp-platform/register_interface.git",     version:  0.4.3 }

export_include_dirs:

sources:
  - rtl/axi_cgra_module/axi_cgra_top.sv
  - rtl/axi_cgra_module/apb_to_reg_adapter.sv
  - rtl/axi_cgra_module/control_unit.sv
  - rtl/axi_cgra_module/deserializer.sv
  - rtl/axi_cgra_module/dma_config_csr.sv
  - rtl/axi_cgra_module/dma_interface.sv
  - rtl/axi_cgra_module/interrupt_controller.sv
